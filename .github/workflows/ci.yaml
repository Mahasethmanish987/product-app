name: UAT promotion gate

on:
  pull_request:
    branches: [dev, uat, main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  IMAGE: manish9817680/product-service

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check --output-format github .

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Checkout with full history
        uses: actions/checkout@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -q

  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name != 'pull_request'

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v5

      - name: Work out the image tag
        id: tag
        run: echo "tag=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build the image
        run: |
          docker build \
            --build-arg SERVICE_VERSION=${{ steps.tag.outputs.tag }} \
            --build-arg GIT_COMMIT="$GITHUB_SHA" \
            -t "$IMAGE:${{ steps.tag.outputs.tag }}" \
            -t "$IMAGE:latest" \
            .

      - name: Smoke test the image before it leaves the runner
        run: |
          docker run -d --name smoke -p 8000:8000 "$IMAGE:${{ steps.tag.outputs.tag }}"

          for _ in $(seq 30); do
            curl -sf localhost:8000/health >/dev/null && break
            sleep 1
          done

          curl -sf localhost:8000/health   | grep -q '"healthy"'
          curl -sf localhost:8000/ready    | grep -q '"ready"'
          curl -sf localhost:8000/version  | grep -q "$GITHUB_SHA"
          curl -sf localhost:8000/products | grep -q '"items"'

          docker rm -f smoke

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the image
        run: |
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
          docker push "$IMAGE:latest"

  deploy:
    name: Helm upgrade on the server
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - name: Check the SSH secrets exist
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          missing=""
          [ -z "$SERVER_HOST" ]    && missing="$missing SERVER_HOST"
          [ -z "$SERVER_USER" ]    && missing="$missing SERVER_USER"
          [ -z "$SERVER_SSH_KEY" ] && missing="$missing SERVER_SSH_KEY"

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "::error::Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

          case "$SERVER_SSH_KEY" in
            *"PRIVATE KEY"*) ;;
            *)
              echo "::error::SERVER_SSH_KEY does not look like a private key."
              echo "::error::Paste the whole file including the BEGIN/END lines - not the .pub."
              exit 1
              ;;
          esac

      - name: SSH in and roll out the new tag
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.tag }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: IMAGE_TAG,GIT_SHA
          script: |
            set -euo pipefail

            # Where the deployments repo is cloned on the server.
            DEPLOY_REPO="${DEPLOY_REPO:-$HOME/traeffic-setup}"
            RELEASE="product-service"
            NAMESPACE="default"

            if [ ! -d "$DEPLOY_REPO" ]; then
              echo "::error::No deployments repo at $DEPLOY_REPO - clone it there or set DEPLOY_REPO."
              exit 1
            fi

            # Pick up any chart changes that were pushed alongside the app.
            git -C "$DEPLOY_REPO" pull --ff-only || \
              echo "WARNING: could not fast-forward $DEPLOY_REPO, using the checkout as is"

            # The charts moved under deployments/; accept either layout.
            CHART_DIR=""
            for candidate in \
              "$DEPLOY_REPO/deployments/charts/product-service" \
              "$DEPLOY_REPO/charts/product-service"
            do
              if [ -d "$candidate" ]; then
                CHART_DIR="$candidate"
                break
              fi
            done

            if [ -z "$CHART_DIR" ]; then
              echo "::error::No product-service chart under $DEPLOY_REPO"
              exit 1
            fi

            echo "Using chart at $CHART_DIR"

            echo "Upgrading $RELEASE to $IMAGE_TAG"

            helm upgrade --install "$RELEASE" "$CHART_DIR" \
              --namespace "$NAMESPACE" \
              --set image.tag="$IMAGE_TAG" \
              --set gitCommit="$GIT_SHA" \
              --wait --timeout 5m

            kubectl -n "$NAMESPACE" rollout status "deploy/$RELEASE" --timeout=2m
            kubectl -n "$NAMESPACE" get pods -l "app=$RELEASE"
