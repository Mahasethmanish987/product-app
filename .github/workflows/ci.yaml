name: Ci 

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]  

jobs:
  build:
    runs-on: ubuntu-latest 
    steps:
     - name: Checkout code 
       uses: actions/checkout@v4
     - name: setup python 
       uses: actions/setup-python@v4 
       with:
         python-version: 3.13
     - name: Install Dependencies
       run: |
         python -m pip install --upgrade pip 
         python -m pip install -r requirements-dev.txt 
     - name: Check ruff 
       run: |
         ruff check . 
     - name: Run tests
       run: |
         pytest tests/     
