[tool.pytest.ini_options]
# Put the project root on sys.path so `from app import app` works.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = import sorting, B = bugbear, UP = pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
